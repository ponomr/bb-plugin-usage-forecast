name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `bb plugin build` comes from the bb CLI; the version matches the
      # host the plugin is checked against (AGENTS.md, Host facts).
      - name: Install the bb CLI
        run: |
          npm install --global bb-app@0.49.0
          npm install --global --prefix "$HOME/.bb/npm" npm@11.16.0
      - run: npm run build
